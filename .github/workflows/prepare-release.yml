name: Prepare release

on:
  workflow_dispatch:
    inputs:
      level:
        description: Version level to bump (major, minor, patch)
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

jobs:
  generate-pr:
    runs-on: ubuntu-latest
    name: Generate release PR

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up mise
      uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable

    - name: Determine version
      id: version
      run: |
        VERSION=$(changie next ${{ inputs.level }})
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Preparing release for $VERSION"

    - name: Prepare release
      run: |
        changie batch ${{ steps.version.outputs.version }}
        changie merge

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
      with:
        title: Release ${{ steps.version.outputs.version }}
        branch: release-${{ steps.version.outputs.version }}
        labels: prepare-release
        commit-message: Prepare release ${{ steps.version.outputs.version }}
        token: ${{ secrets.PAT }}
        body: |
          Preparing release ${{ steps.version.outputs.version }}.

          After merging, trigger the "Publish release" workflow
          with ref set to `main` to complete the release.

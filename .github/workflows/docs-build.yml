name: Build Docs

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
        description: "Git ref to checkout (empty = current ref)"
      artifact-name:
        type: string
        required: true
        description: "Name for the artifact"
      upload-as-pages:
        type: boolean
        required: false
        default: false
        description: "Upload as GitHub Pages artifact"
      minify:
        type: boolean
        required: false
        default: true
        description: "Minify the output"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Match tools for the comparison build
        if: ${{ github.event_name == 'pull_request' && inputs.ref == github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          if git diff --quiet HEAD FETCH_HEAD -- docs/mise.toml; then
            git show FETCH_HEAD:docs/mise.lock > docs/mise.lock
          fi

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          working_directory: docs
          cache_key_prefix: mise-v2-docs

      - name: Build
        run: mise run build
        working-directory: docs
        env:
          DOC2GO_MINIFY: ${{ inputs.minify }}

      - name: Archive
        if: ${{ !inputs.upload-as-pages }}
        run: |
          tar -cvf docs.tar -C docs/public .
          gzip docs.tar

      - name: Upload artifact
        if: ${{ !inputs.upload-as-pages }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ inputs.artifact-name }}
          path: docs.tar.gz

      - name: Upload pages artifact
        if: ${{ inputs.upload-as-pages }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/public/

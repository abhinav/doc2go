name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ '*' ]

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      name: Check out repository
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable
    - run: mise run lint

  test:
    runs-on: ${{ matrix.os }}
    name: Test (${{ matrix.os}})
    strategy:
      matrix:
        os: ["ubuntu-latest", "windows-latest"]
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable

    - name: Test
      run: mise run cover:unit
      shell: bash

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        files: ./cover.out

  test-integration:
    runs-on: ubuntu-latest
    name: Integration test
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Set up mise
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        cache_key_prefix: mise-v0-stable

    - name: Test
      run: mise run cover:integration
      shell: bash

    - name: Upload coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
      with:
        files: ./cover.integration.out

  # Stable name for branch protection rules.
  ci-ok:
    name: CI OK
    needs: [lint, test, test-integration]
    runs-on: ubuntu-latest
    steps:
    - name: CI OK
      run: exit 0
